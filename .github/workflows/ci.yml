name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile scripts
        run: python -m py_compile NA_text_converter_finder.py app_resources.py lib/find_hairpins.py

      - name: Check version output
        run: python NA_text_converter_finder.py --version

      - name: Check standalone hairpin CLI
        run: |
          python lib/find_hairpins.py GGGAAACCC /tmp/hairpins.rtf 3 3 1 > /tmp/hairpins.json
          test -s /tmp/hairpins.rtf
          python - <<'PY'
          import json
          with open("/tmp/hairpins.json") as handle:
              text = handle.read()
          payload = text.split("\nWrote ", 1)[0]
          hairpins = json.loads(payload)
          assert len(hairpins) == 1
          assert hairpins[0]["stem_length"] == 3
          assert hairpins[0]["loop_length"] == 3
          assert hairpins[0]["stem1_start"] == 1
          assert hairpins[0]["stem2_start"] == 7
          PY

      - name: Check v7_1 GUI controls, scrolling, search statistics, hairpins, and i-prefix handling
        run: |
          QT_QPA_PLATFORM=offscreen python - <<'PY'
          from PyQt5.QtCore import QPoint, QPointF, Qt
          from PyQt5.QtGui import QWheelEvent
          from PyQt5.QtWidgets import QApplication
          import NA_text_converter_finder as m

          app = QApplication([])
          gui = m.NAToolsGUI()
          assert m.APP_VERSION == "7_1"
          assert m.HAIRPIN_MODULE_AVAILABLE
          assert gui.sequence_input.lineWrapMode() == gui.sequence_input.WidgetWidth
          assert gui.search_input.lineWrapMode() == gui.search_input.WidgetWidth
          assert gui.output_text.lineWrapMode() == gui.output_text.WidgetWidth
          assert gui.sequence_input.horizontalScrollBarPolicy() == m.Qt.ScrollBarAlwaysOff
          assert gui.search_input.horizontalScrollBarPolicy() == m.Qt.ScrollBarAlwaysOff
          assert gui.output_text.horizontalScrollBarPolicy() == m.Qt.ScrollBarAlwaysOff
          assert gui.sequence_input.verticalScrollBarPolicy() == m.Qt.ScrollBarAsNeeded
          assert gui.search_input.verticalScrollBarPolicy() == m.Qt.ScrollBarAsNeeded
          assert gui.output_text.verticalScrollBarPolicy() == m.Qt.ScrollBarAsNeeded
          assert (
              gui.clear_input_button.parentWidget()
              is not gui.sequence_input.parentWidget()
          )

          long_sequence = "ATCG" * 10000
          gui.mode_combo.setCurrentText(m.MODE_SEARCH)
          gui.show()
          app.processEvents()
          assert (
              gui.sequence_input.geometry().bottom()
              < gui.sequence_info_text.geometry().top()
          )
          assert (
              gui.search_input.geometry().bottom()
              < gui.search_sequence_info_text.geometry().top()
          )

          for editor in (gui.sequence_input, gui.search_input, gui.output_text):
              editor.setPlainText(long_sequence)
              app.processEvents()
              scroll_bar = editor.verticalScrollBar()
              scroll_bar.setValue(0)
              local_position = QPointF(editor.viewport().rect().center())
              global_position = QPointF(
                  editor.viewport().mapToGlobal(editor.viewport().rect().center())
              )
              wheel_event = QWheelEvent(
                  local_position,
                  global_position,
                  QPoint(0, 0),
                  QPoint(0, -120),
                  Qt.NoButton,
                  Qt.NoModifier,
                  Qt.ScrollUpdate,
                  False,
              )
              QApplication.sendEvent(editor.viewport(), wheel_event)
              app.processEvents()
              assert scroll_bar.maximum() > 0
              assert scroll_bar.value() > 0

          gui.sequence_input.setPlainText("ATCG")
          gui.convert_combo.setCurrentText(m.CONVERT_REVERSE_COMPLEMENT)
          gui.clear_input_button.click()
          assert gui.sequence_input.toPlainText() == ""

          gui.mode_combo.setCurrentText(m.MODE_CONVERT)
          gui.sequence_input.setPlainText("GCTA")
          gui.convert_combo.setCurrentText(m.CONVERT_REVERSE_WITH_I_PREFIX)
          gui.convert_sequence()
          assert gui.output_text.toPlainText() == "iAiTiCiG"

          gui.i_prefix_reverse_checkbox.setChecked(True)
          gui.sequence_input.setPlainText("iAiTiCiG")
          gui.convert_combo.setCurrentText(m.CONVERT_TO_DNA)
          gui.convert_sequence()
          assert gui.output_text.toPlainText() == "GCTA"
          assert "i-prefix reverse handling" in gui.output_summary.text()

          gui.mode_combo.setCurrentText(m.MODE_ADD)
          gui.prefix_input.setText("x")
          gui.add_sequence()
          assert gui.output_text.toPlainText() == "xGxCxTxA"

          gui.mode_combo.setCurrentText(m.MODE_SEARCH)
          gui.search_input.setPlainText("GCTA")
          gui.search_sequence()
          assert "Exact matches: 1" in gui.output_summary.text()
          assert gui.output_text.toPlainText() == "GCTA"

          gui.i_prefix_reverse_checkbox.setChecked(False)
          gui.sequence_input.setPlainText("ATCG")
          gui.convert_combo.setCurrentText(m.CONVERT_REVERSE_COMPLEMENT)
          gui.set_output_plain_text("copy me")
          gui.copy_output_button.click()
          assert app.clipboard().text() == "copy me"

          gui.search_input.setPlainText("(AG)2 T")
          search_info = gui.search_sequence_info_text.toPlainText()
          assert "Search sequence info after repeat expansion" in search_info
          assert "DNA/RNA length=5" in search_info
          assert "A=2" in search_info
          assert "T/U=1" in search_info
          assert "G=2" in search_info

          checkbox_text = gui.include_complementary_checkbox.text()
          assert "not reverse-complementary" in checkbox_text

          gui.mode_combo.setCurrentText(m.MODE_FIND_HAIRPINS)
          assert gui.hairpin_group.isVisible()
          gui.sequence_input.setPlainText("GGGAAACCC")
          gui.hairpin_min_stem_spin.setValue(3)
          gui.hairpin_min_loop_spin.setValue(3)
          gui.find_hairpins_sequence()
          assert "Hairpins found: 1" in gui.output_summary.text()
          hairpin_output = gui.output_text.toPlainText()
          assert "Hairpin 1" in hairpin_output
          assert "stem length=3" in hairpin_output
          assert "stem1 start=1" in hairpin_output
          assert "stem2 start=7" in hairpin_output

          gui.i_prefix_reverse_checkbox.setChecked(True)
          gui.sequence_input.setPlainText("iCiCiCiAiAiAiGiGiG")
          gui.find_hairpins_sequence()
          assert "Hairpins found: 1" in gui.output_summary.text()

          assert gui.windowTitle().endswith("v7_1")
          PY

      - name: Check standalone script without icon resources
        run: |
          standalone_dir="$(mktemp -d)"
          cp NA_text_converter_finder.py "$standalone_dir/"
          cd "$standalone_dir"
          python NA_text_converter_finder.py --version
          QT_QPA_PLATFORM=offscreen python -c "from PyQt5.QtWidgets import QApplication; import NA_text_converter_finder as m; app = QApplication([]); gui = m.NAToolsGUI(); assert not m.APP_RESOURCES_AVAILABLE; assert not m.HAIRPIN_MODULE_AVAILABLE; assert gui.windowTitle().endswith('v7_1')"
